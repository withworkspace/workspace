name: Release

# A v* tag builds ws, with its web UI built in, for each platform below, and
# publishes the builds as a GitHub release. A pull request that changes this
# file runs the builds without releasing, to try them.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        # Each is built with cgo on: code navigation (tree-sitter) is C, and
        # without cgo ws builds anyway, with navigation off. So each is built
        # on its own platform, but for linux/arm64, cross-compiled with gcc:
        # GitHub's arm64 runners aren't for private repos.
        include:
          - { goos: darwin, goarch: arm64, runner: macos-latest }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-latest, cross_cc: aarch64-linux-gnu-gcc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the web UI
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Install the cross compiler
        if: matrix.cross_cc
        run: sudo apt-get update -q && sudo apt-get install -yq gcc-aarch64-linux-gnu

      - name: Build ws
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CROSS_CC: ${{ matrix.cross_cc }}
          # The C is built for the macOS Go itself supports, not the runner's.
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::7}"; fi
          if [ -n "$CROSS_CC" ]; then export CC="$CROSS_CC"; fi
          test -f internal/web/dist/index.html
          go build -trimpath -ldflags="-s -w -X main.version=$version" -o out/workspace ./cmd/workspace
          if ! go version -m out/workspace | grep -q 'CGO_ENABLED=1'; then
            echo "built without cgo, so without code navigation"
            exit 1
          fi
          if [ -z "$CROSS_CC" ]; then out/workspace --version; fi
          tar -czf "workspace_${version}_${GOOS}_${GOARCH}.tar.gz" -C out workspace

      - uses: actions/upload-artifact@v7
        with:
          name: workspace_${{ matrix.goos }}_${{ matrix.goarch }}
          path: workspace_*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum workspace_*.tar.gz > checksums.txt
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease workspace_*.tar.gz checksums.txt
