  last_reply = "The house sorting CLI is done and committed as `de416f9` on `house-sort`, and I've reported the stage done to ws. The mission had a single stage, so there's nothing left for the orchestrator to dispatch.\n\n**What works**\n- `go run . sort \"Harry Potter\"` prints `Ravenclaw`, and the same house on every run.\n- `\"harry potter\"` and `\" Harry Potter \"` give the same house as `\"Harry Potter\"`.\n- The name can also come from stdin: `echo \"Harry Potter\" | go run . sort`.\n- `sort` with no name prints usage to stderr and exits 2. An unknown command does the same.\n- `go vet`, `gofmt` and `go test ./...` all pass.\n\n**Files**\n- `sort.go`: `sortHouse` takes the sha256 of the trimmed, lower-cased name, reads the first 4 bytes as a big-endian integer, and takes it mod 4 to index Gryffindor, Hufflepuff, Ravenclaw, Slytherin. The sorting is separate from the CLI, as the brief asked.\n- `main.go`: a `run()` function takes its I/O as parameters so the tests can drive it without a process.\n- `sort_test.go`: covers determinism, a pinned value, normalisation, that all outputs are one of the four houses, and the CLI paths.\n- `README.md`: documents usage and tests.\n\n**Choices I made**\n- `sort` is a subcommand, because the acceptance criteria use `go run . sort \"Harry Potter\"`. Running with no arguments still prints the existing greeting, so `TestGreeting` keeps passing.\n- sha256 rather than fnv. Either satisfies the brief.\n- Stdin is read only when it is not a terminal, so `sort` alone at a terminal prin…"
