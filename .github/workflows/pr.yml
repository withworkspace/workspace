name: PR Checks

on:
  pull_request:
  push:
    branches: [main, v2]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: git config --global user.name "CI" && git config --global user.email "ci@test"

      - run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Web UI builds, and leaves the tree as it was
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          if [ -n "$(git status --porcelain)" ]; then
            echo "Building the web UI changed the tree: internal/web/dist should be ignored but for its .gitkeep"
            git status --porcelain
            exit 1
          fi

      - run: pnpm --dir web test

      - run: go build ./...

      - run: go test ./...
