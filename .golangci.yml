version: "2"

# `just lint` runs these on all of ws. errcheck and noctx are set up here but
# not on: `just lint` runs them only on what's changed since main (see the
# justfile), since main has hundreds of each from before they were checked.
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - wastedassign
    - rowserrcheck
    - unconvert
    - copyloopvar
  settings:
    staticcheck:
      # Bugs and simplifications; not style (ST) or quick fixes (QF).
      checks: ["all", "-ST*", "-QF*"]
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        # Rolling back after a failure: the failure is the error to say.
        - (*database/sql.Tx).Rollback
        # Writing a response: a client that's gone has nothing to be told.
        - (net/http.ResponseWriter).Write
        - (net.Conn).SetDeadline
        - (net.Conn).SetWriteDeadline
        # Signalling a process group that may have ended already.
        - syscall.Kill
        # Fails only on a flag that isn't there: a mistake a test finds.
        - (*github.com/spf13/cobra.Command).RegisterFlagCompletionFunc
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
        - (*github.com/spf13/pflag.FlagSet).MarkHidden
  exclusions:
    presets: [std-error-handling, common-false-positives]
    rules:
      - path: _test\.go
        linters: [errcheck, noctx]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
