version: "2"

# `just lint` runs these on all of ws. errcheck is set up here but not on:
# `just lint` runs it only on what's changed since main (see the justfile),
# since main has hundreds from before it was checked.
#
# noctx: a command, request or query with no context to end it is marked
# `//nolint:noctx // why`, where it outlives its caller on purpose or
# something else bounds it.
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - wastedassign
    - rowserrcheck
    - unconvert
    - copyloopvar
    - noctx
  settings:
    staticcheck:
      # Bugs and simplifications; not style (ST) or quick fixes (QF).
      checks: ["all", "-ST*", "-QF*"]
    errcheck:
      exclude-functions: [fmt.Fprintf, fmt.Fprintln, fmt.Fprint]
  exclusions:
    presets: [std-error-handling, common-false-positives]
    rules:
      - path: _test\.go
        linters: [errcheck, noctx]
      # Listening on a socket, or dialling one with a timeout: nothing for a
      # context to end.
      - linters: [noctx]
        text: "net\\.(Listen|DialTimeout) must not be called"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
