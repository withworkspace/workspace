version: "2"

# `just lint` runs these on all of ws. errcheck is set up here but not on:
# `just lint` runs it only on what's changed since main (see the justfile),
# since main has hundreds from before it was checked.
#
# noctx: a command, request or query with no context to end it is marked
# `//nolint:noctx // why`, where it outlives its caller on purpose or
# something else bounds it.
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - wastedassign
    - rowserrcheck
    - unconvert
    - copyloopvar
    - noctx
  settings:
    staticcheck:
      # Bugs and simplifications; not style (ST) or quick fixes (QF).
      checks: ["all", "-ST*", "-QF*"]
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        # Rolling back after a failure: the failure is the error to say.
        - (*database/sql.Tx).Rollback
        # Writing a response: a client that's gone has nothing to be told.
        - (net/http.ResponseWriter).Write
        - (net.Conn).SetDeadline
        - (net.Conn).SetWriteDeadline
        # Signalling a process group that may have ended already.
        - syscall.Kill
        # Fails only on a flag that isn't there: a mistake a test finds.
        - (*github.com/spf13/cobra.Command).RegisterFlagCompletionFunc
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
        - (*github.com/spf13/pflag.FlagSet).MarkHidden
  exclusions:
    presets: [std-error-handling, common-false-positives]
    rules:
      - path: _test\.go
        linters: [errcheck, noctx]
      # Listening on a socket, or dialling one with a timeout: nothing for a
      # context to end.
      - linters: [noctx]
        text: "net\\.(Listen|DialTimeout) must not be called"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
